<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen PER - Sistema de Exámenes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- CSS Unificado -->
    <link rel="stylesheet" href="styles/unified-navigation.css">
    
    <!-- Configuration -->
    <script src="config.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .exam-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        .exam-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
        }

        /* Estilos específicos del examen */
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .exam-timer {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }

        .exam-progress {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 0.5rem;
            margin-bottom: 1rem;
        }

        .progress-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 6px;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8f9ff;
            border: 2px solid rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.1);
        }

        .question-number {
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .answer-options {
            display: grid;
            gap: 1rem;
        }

        .answer-option {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .answer-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .answer-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .answer-letter {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .answer-option.selected .answer-letter {
            background: rgba(255, 255, 255, 0.2);
        }

        .exam-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 2px solid #e5e7eb;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 4rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .alert-info {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }

        .alert-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .alert-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .exam-container {
                padding: 1rem;
            }
            
            .exam-content {
                padding: 1.5rem;
                margin-top: 1rem;
            }
            
            .exam-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .question-card {
                padding: 1.5rem;
            }
            
            .exam-navigation {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="exam-container">
        <!-- Navegación Unificada Superior -->
        <div class="unified-top-nav">
            <button class="unified-back-btn" onclick="window.location.href='exam-system.html'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <h1 class="page-title">
            </h1>
            <div></div>
        </div>

        <!-- Barra de Navegación con Tabs -->
        <div class="unified-tab-nav">
            <a href="exam-system.html" class="unified-tab-item">
                <i class="fas fa-home"></i> Principal
            </a>
            <a href="visor-nueva-arquitectura.html" class="unified-tab-item">
                <i class="fas fa-book"></i> Banco
            </a>
            <a href="statistics-dashboard.html" class="unified-tab-item">
                <i class="fas fa-chart-bar"></i> Estadísticas
            </a>
            <a href="question-statistics-dashboard.html" class="unified-tab-item">
                <i class="fas fa-chart-line"></i> Preguntas
            </a>
            <a href="study-config.html" class="unified-tab-item">
                <i class="fas fa-book-reader"></i> Estudio
            </a>
            <a href="exam.html" class="unified-tab-item active">
                <i class="fas fa-file-alt"></i> Examen
            </a>
        </div>

        <!-- Contenido del Examen -->
        <div class="exam-content">
            <!-- Loading State -->
            <div id="loadingState" class="loading-spinner">
                <div class="spinner"></div>
                <p>Generando examen...</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Exam Interface -->
            <div id="examInterface" style="display: none;">
                <!-- Exam Header -->
                <div class="exam-header">
                    <div>
                        <h2 style="margin: 0; color: #2d3748;">
                        </h2>
                        <p style="margin: 0; color: #6b7280;">45 preguntas - 90 minutos</p>
                    </div>
                    <div class="exam-timer" id="examTimer">
                        <i class="fas fa-clock me-2"></i>
                        <span id="timerDisplay">90:00</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="exam-progress">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <span style="font-weight: 600; color: #2d3748;">Progreso</span>
                        <span style="font-weight: 600; color: #667eea;" id="progressText">Pregunta 1 de 45</span>
                    </div>
                    <div class="progress" style="height: 8px; background: #e5e7eb; border-radius: 4px;">
                        <div class="progress-bar" id="progressBar" style="width: 2.2%;"></div>
                    </div>
                </div>

                <!-- Question Card -->
                <div class="question-card" id="questionCard">
                    <div class="question-number" id="questionNumber">1</div>
                    <div class="question-text" id="questionText">
                        Cargando pregunta...
                    </div>
                    <div class="answer-options" id="answerOptions">
                        <!-- Las opciones se cargarán dinámicamente -->
                    </div>
                </div>

                <!-- Navigation -->
                <div class="exam-navigation">
                    <button class="unified-btn-secondary" id="prevBtn" onclick="examSystem.goToPreviousQuestion()" disabled>
                        <i class="fas fa-arrow-left"></i> Anterior
                    </button>
                    
                    <div style="display: flex; gap: 1rem;">
                        <button class="unified-btn-secondary" id="pauseBtn" onclick="examSystem.pauseExam()">
                            <i class="fas fa-pause"></i> Pausar
                        </button>
                        <button class="unified-btn-primary" id="nextBtn" onclick="examSystem.goToNextQuestion()">
                            Siguiente <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    
                    <button class="unified-btn-danger" id="finishBtn" onclick="examSystem.finishExam()" style="display: none;">
                        <i class="fas fa-check"></i> Finalizar Examen
                    </button>
                </div>
            </div>

            <!-- Results Interface -->
            <div id="resultsInterface" style="display: none;">
                <!-- Los resultados se mostrarán aquí -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="exam-page.js"></script>
</body>
</html>
