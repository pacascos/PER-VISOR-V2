<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Test de Estudio - Zarpeo</title>

    <!-- Favicon dinámico -->
    <link rel="icon" type="image/svg+xml" href="" id="dynamic-favicon">
    <script>
        const isProduction = window.location.hostname === 'zarpeo.com' || window.location.hostname === 'www.zarpeo.com';
        document.getElementById('dynamic-favicon').href = isProduction ? 'favicon-prod.svg' : 'favicon.svg';
        window.ENVIRONMENT = isProduction ? 'PRODUCCIÓN' : 'DESARROLLO';
        window.ENVIRONMENT_COLOR = isProduction ? '#dc2626' : '#059669';
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    

    <!-- Configuration -->
    <script src="config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 2rem 0;
        }

        .environment-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            z-index: 9999;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .results-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .score-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 1rem 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .score-label {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card-body {
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid #e5e7eb;
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #667eea;
            margin: 2rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ut-results {
            display: grid;
            gap: 1rem;
        }

        .ut-result-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 1rem;
            border: 2px solid #e5e7eb;
        }

        .ut-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .ut-number {
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .ut-title {
            flex: 1;
            font-weight: 600;
            font-size: 1.05rem;
            color: #333;
        }

        .ut-score {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .ut-score.good {
            color: #059669;
        }

        .ut-score.bad {
            color: #dc2626;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        /* Estilos de navegación movidos a unified-navigation.css */

        .congrats-message {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .needs-improvement {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mode-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .mode-random {
            background: rgba(255, 255, 255, 0.2);
        }

        .mode-failed {
            background: rgba(239, 68, 68, 0.3);
        }

        .mode-new {
            background: rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <!-- Indicador de entorno -->
    <div class="environment-indicator" id="env-indicator"></div>

    <div class="main-container">
        <div class="results-card">
            <div class="card-header">
                <h1><i class="fas fa-book-reader"></i> Resultados del Test de Estudio</h1>
                <div id="mode-display"></div>
            </div>

            <div class="card-body">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Cargando resultados...</p>
                </div>

                <div id="results-content" style="display: none;">
                    <!-- Message -->
                    <div id="result-message"></div>

                    <!-- Overall score -->
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div class="score-display" id="score-display">0%</div>
                        <div class="score-label">
                            <span id="correct-count">0</span> de <span id="total-count">0</span> correctas
                        </div>
                    </div>

                    <!-- Stats grid -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value" id="correct-value">0</div>
                            <div class="stat-label">Correctas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">❌</div>
                            <div class="stat-value" id="incorrect-value" style="cursor: pointer; text-decoration: underline;" onclick="viewIncorrectQuestions()">0</div>
                            <div class="stat-label">Incorrectas</div>
                        </div>
                    </div>

                    <!-- Botón de volver -->
                    <div style="text-align: left; margin-bottom: 20px;">
                        <button class="btn btn-outline-secondary" onclick="goToHome()">
                            <i class="fas fa-arrow-left"></i> Volver
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - usar window.API_BASE si está disponible
        const API_URL = window.API_BASE || (window.location.hostname === 'zarpeo.com' || window.location.hostname === 'www.zarpeo.com'
            ? 'https://per-api-435987927843.europe-west1.run.app'
            : 'http://localhost:5001');

        console.log('🌐 study-results.html - API_URL:', API_URL);

        let studyTestId = null;
        let resultsData = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Clear old sessionStorage to force fresh data from API
            sessionStorage.removeItem('studyTestResults');
            
            // Set environment indicator
            const envIndicator = document.getElementById('env-indicator');
            envIndicator.textContent = window.ENVIRONMENT;
            envIndicator.style.background = window.ENVIRONMENT_COLOR;

            // Get study test ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            studyTestId = urlParams.get('study_test_id');

            if (!studyTestId) {
                alert('ID de test de estudio no encontrado');
                window.location.href = 'exam-system.html';
                return;
            }

            // Try to fetch from API first, fallback to sessionStorage if API fails
            try {
                await loadResults();
            } catch (error) {
                console.log('⚠️ API failed, trying sessionStorage fallback');
                const storedResults = sessionStorage.getItem('studyTestResults');
                if (storedResults) {
                    resultsData = JSON.parse(storedResults);
                    displayResults();
                } else {
                    throw error;
                }
            }
        });

        async function loadResults() {
            try {
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                const response = await fetch(`${API_URL}/study-tests/${studyTestId}/results`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Error loading results');
                }

                const data = await response.json();
                console.log('📊 Datos recibidos de la API:', data);

                // Use data directly from API (it already has calculated fields)
                resultsData = data;
                displayResults();

            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('loading').innerHTML = `
                    <p style="color: #dc2626;">Error cargando resultados. <a href="exam-system.html">Volver al inicio</a></p>
                `;
            }
        }

        function calculateResultsFromQuestions(data) {
            // This would be called if we don't have results from submit
            // For now, redirect to submit endpoint
            window.location.href = 'exam-system.html';
            return null;
        }

        function displayResults() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results-content').style.display = 'block';

            const scorePercentage = resultsData.score_percentage || 0;
            const correctAnswers = resultsData.correct_answers || 0;
            const totalQuestions = resultsData.total_questions || 0;
            
            // Calculate failed questions (incorrect + unanswered)
            let incorrectAnswers = 0;
            
            if (resultsData.questions && Array.isArray(resultsData.questions)) {
                resultsData.questions.forEach(question => {
                    // Count as failed: incorrect answers OR unanswered questions
                    if (question.is_correct === false || 
                        question.user_answer === null || 
                        question.user_answer === '' || 
                        question.is_correct === null) {
                        incorrectAnswers++;
                    }
                });
            } else {
                // Fallback to old calculation if questions array is not available
                incorrectAnswers = totalQuestions - correctAnswers;
            }
            
            const duration = resultsData.duration_minutes || 0;

            // Display score
            document.getElementById('score-display').textContent = `${scorePercentage.toFixed(1)}%`;
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;

            // Display stats
            document.getElementById('correct-value').textContent = correctAnswers;
            document.getElementById('incorrect-value').textContent = incorrectAnswers;

            // Display message based on score
            const messageDiv = document.getElementById('result-message');
            if (scorePercentage >= 70) {
                messageDiv.className = 'congrats-message';
                messageDiv.innerHTML = '<i class="fas fa-trophy"></i> ¡Excelente trabajo! Has demostrado un buen dominio de estos temas.';
            } else if (scorePercentage >= 50) {
                messageDiv.className = 'needs-improvement';
                messageDiv.innerHTML = '<i class="fas fa-chart-line"></i> Buen intento. Sigue practicando para mejorar tu puntuación.';
            } else {
                messageDiv.className = 'needs-improvement';
                messageDiv.innerHTML = '<i class="fas fa-book"></i> Necesitas repasar estos temas. No te rindas, la práctica hace al maestro.';
            }

            // Note: UT breakdown would require additional API call to get per-UT stats
            // For now, show simplified version
            displaySimplifiedUTResults();
        }

        function displaySimplifiedUTResults() {
            // This would be enhanced with actual UT statistics from the API
            const utResultsDiv = document.getElementById('ut-results');
            utResultsDiv.innerHTML = `
                <div class="ut-result-card">
                    <p style="text-align: center; color: #666;">
                        <i class="fas fa-info-circle"></i>
                        Las estadísticas detalladas por UT estarán disponibles en una próxima versión.
                    </p>
                </div>
            `;

        }

        function goToHome() {
            window.location.href = 'exam-system.html';
        }



        async function viewIncorrectQuestions() {
            try {
                console.log('🔍 Obteniendo preguntas incorrectas del test de estudio:', studyTestId);

                const token = localStorage.getItem('token') || localStorage.getItem('authToken');

                // Obtener solo las preguntas falladas del test de estudio
                const response = await fetch(`${API_URL}/study-tests/${studyTestId}/failed-questions`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                // El endpoint ya devuelve solo las preguntas falladas
                const failedQuestions = data.failed_questions || [];
                
                console.log('🔍 Total de preguntas falladas encontradas:', failedQuestions.length);
                console.log('🔍 Detalles de preguntas falladas:', failedQuestions.map(q => ({
                    question_id: q.question_id,
                    user_answer: q.user_answer,
                    correct_answer: q.respuesta_correcta,
                    is_correct: q.is_correct
                })));

                if (failedQuestions.length > 0) {
                    // Extraer IDs de las preguntas incorrectas
                    const incorrectQuestionIds = failedQuestions.map(q => q.question_id);

                    // Guardar el filtro en localStorage para que el banco de preguntas lo use
                    localStorage.setItem('failedQuestionsFilter', JSON.stringify({
                        studyTestId: studyTestId,
                        questionIds: incorrectQuestionIds,
                        examDate: new Date().toISOString(),
                        totalFailed: failedQuestions.length
                    }));

                    console.log('🔍 Abriendo banco de preguntas con', incorrectQuestionIds.length, 'preguntas incorrectas');

                    // Abrir banco de preguntas en nueva pestaña
                    window.open('visor-nueva-arquitectura.html?filter=failed_questions', '_blank');
                } else {
                    showNoIncorrectModal();
                }

            } catch (error) {
                console.error('❌ Error obteniendo preguntas incorrectas:', error);
                alert(`Error cargando preguntas incorrectas: ${error.message}`);
            }
        }
    </script>

    <!-- Modal Simple para Sin Preguntas Incorrectas -->
    <div id="noIncorrectQuestionsModal" class="simple-modal" style="display: none;">
        <div class="simple-modal-content">
            <div class="simple-modal-header">
                <h5>🎉 ¡Excelente!</h5>
                <button type="button" class="simple-modal-close" onclick="hideNoIncorrectModal()">&times;</button>
            </div>
            <div class="simple-modal-body">
                <p>¡Felicidades! No hay preguntas incorrectas en este test.</p>
                <p><small>Has respondido todas las preguntas correctamente. ¡Sigue así!</small></p>
            </div>
            <div class="simple-modal-footer">
                <button type="button" class="btn btn-success" onclick="hideNoIncorrectModal()">
                    ¡Genial!
                </button>
            </div>
        </div>
    </div>

    <style>
        .simple-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .simple-modal-content {
            background: white;
            border-radius: 10px;
            padding: 0;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .simple-modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .simple-modal-header h5 {
            margin: 0;
            color: #28a745;
            font-size: 1.1rem;
        }

        .simple-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .simple-modal-close:hover {
            color: #333;
        }

        .simple-modal-body {
            padding: 20px;
        }

        .simple-modal-body p {
            margin: 0 0 10px 0;
        }

        .simple-modal-body small {
            color: #666;
        }

        .simple-modal-footer {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .simple-modal-footer .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .simple-modal-footer .btn-success {
            background: #28a745;
            color: white;
        }

        .simple-modal-footer .btn:hover {
            opacity: 0.9;
        }
    </style>

    <script>
        function showNoIncorrectModal() {
            document.getElementById('noIncorrectQuestionsModal').style.display = 'flex';
        }

        function hideNoIncorrectModal() {
            document.getElementById('noIncorrectQuestionsModal').style.display = 'none';
        }
    </script>
</body>
</html>
