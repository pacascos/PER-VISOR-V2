<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarpeo - Acceso</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Zarpeo Brand CSS -->
    <link rel="stylesheet" href="styles/zarpeo-brand.css">

    <!-- Zarpeo Icons -->
    <link rel="stylesheet" href="icons/zarpeo-icons.css">

    <!-- Configuration -->
    <script src="config.js"></script>

    <style>
        /* Login Page Specific Styles */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: var(--space-4);
            padding-right: 8%;
            background: var(--color-marino);
            position: relative;
            overflow: hidden;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Dark overlay for better readability */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(11, 60, 93, 0.7) 0%,
                rgba(14, 107, 168, 0.5) 50%,
                rgba(46, 196, 182, 0.4) 100%
            );
            z-index: 1;
        }

        .environment-indicator {
            position: fixed;
            top: var(--space-3);
            right: var(--space-3);
            padding: var(--space-2) var(--space-3);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-inverse);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-heading);
            font-size: var(--text-xs);
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-xl);
            padding: var(--space-10);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .login-logo {
            width: 180px;
            height: auto;
            margin-bottom: var(--space-4);
        }

        .login-header h1 {
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--color-marino);
            margin-bottom: var(--space-2);
        }

        .login-header p {
            font-family: var(--font-body);
            color: var(--text-secondary);
            font-size: var(--text-base);
            margin: 0;
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-label {
            display: block;
            font-family: var(--font-heading);
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--text-primary);
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            transition: all var(--transition-base);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-oceano);
            box-shadow: 0 0 0 3px rgba(14, 107, 168, 0.1);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: var(--space-4);
            border: none;
            border-radius: var(--border-radius);
            font-family: var(--font-heading);
            font-size: var(--text-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-primary {
            background: var(--color-oceano);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--color-marino);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .auth-toggle {
            text-align: center;
            margin-top: var(--space-6);
            font-family: var(--font-body);
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .auth-toggle a {
            color: var(--color-oceano);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-fast);
        }

        .auth-toggle a:hover {
            color: var(--color-marino);
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .message {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--border-radius);
            margin-bottom: var(--space-4);
            font-family: var(--font-body);
            font-size: var(--text-sm);
            display: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: var(--space-6) 0;
            color: var(--text-muted);
            font-size: var(--text-sm);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 var(--space-3);
        }

        /* Footer link */
        .login-footer {
            text-align: center;
            margin-top: var(--space-6);
            padding-top: var(--space-4);
            border-top: 1px solid var(--border-color);
        }

        .login-footer a {
            color: var(--text-muted);
            font-size: var(--text-xs);
            text-decoration: none;
        }

        .login-footer a:hover {
            color: var(--color-oceano);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: var(--space-6);
                border-radius: var(--border-radius-lg);
            }

            .login-header h1 {
                font-size: var(--text-2xl);
            }

            .login-logo {
                width: 140px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="assets/video-background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <!-- Indicador de entorno -->
    <div class="environment-indicator" id="env-indicator"></div>

    <div class="login-container">
        <div class="login-header">
            <!-- Logo Zarpeo SVG inline -->
            <svg class="login-logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                <!-- Boat icon -->
                <g transform="translate(0, 5)">
                    <path d="M5 35 L25 35 L30 25 L20 10 L15 25 L5 35" fill="#0E6BA8" stroke="#0B3C5D" stroke-width="1"/>
                    <path d="M20 10 L20 35" stroke="#0B3C5D" stroke-width="2"/>
                    <path d="M20 12 L35 22 L20 25" fill="#2EC4B6" stroke="#0B3C5D" stroke-width="1"/>
                    <path d="M2 38 Q20 45 38 38" stroke="#0E6BA8" stroke-width="2" fill="none"/>
                </g>
                <!-- Text -->
                <text x="50" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#0B3C5D">Zarpeo</text>
                <text x="50" y="52" font-family="Inter, sans-serif" font-size="10" fill="#64748B" letter-spacing="1">NÁUTICA &amp; PESCA</text>
            </svg>
            <p>Tu banco de preguntas náuticas</p>
        </div>

        <!-- Messages -->
        <div class="message error-message" id="error-message"></div>
        <div class="message success-message" id="success-message"></div>

        <!-- Login Form -->
        <div id="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Usuario o Email</label>
                    <input type="text" class="form-control" id="loginUsername" placeholder="tu@email.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Entrar
                </button>
            </form>
            <div class="auth-toggle">
                ¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a>
            </div>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="hidden">
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="registerUsername" placeholder="marinero123" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    Crear cuenta
                </button>
            </form>
            <div class="auth-toggle">
                ¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión aquí</a>
            </div>
        </div>

        <div class="login-footer">
            <a href="#">Preparación para el PER · Patrón de Embarcaciones de Recreo</a>
        </div>
    </div>

    <script>
        // Configuration - usar window.API_BASE si está disponible
        const isRemote = window.location.hostname === 'zarpeo.com' ||
                         window.location.hostname === 'www.zarpeo.com' ||
                         window.location.hostname.includes('run.app');
        const API_URL = window.API_BASE || (isRemote
            ? 'https://per-api-435987927843.europe-west1.run.app'
            : 'http://localhost:5001');

        console.log('🌐 login.html - API_URL:', API_URL);

        // Set environment indicator
        const envIndicator = document.getElementById('env-indicator');
        const isProduction = window.location.hostname === 'zarpeo.com' || window.location.hostname === 'www.zarpeo.com';
        envIndicator.textContent = isProduction ? 'PRODUCCIÓN' : (isRemote ? 'STAGING' : 'DESARROLLO');
        envIndicator.style.background = isProduction ? 'rgba(239, 68, 68, 0.8)' : (isRemote ? 'rgba(244, 162, 97, 0.8)' : 'rgba(16, 185, 129, 0.8)');

        // Check if already logged in
        const token = localStorage.getItem('token') || localStorage.getItem('authToken');
        if (token) {
            console.log('✅ Ya hay token, redirigiendo a dashboard');
            window.location.href = 'exam-system.html';
        }

        // Toggle between login and register
        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            hideMessages();
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            hideMessages();
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('username', data.username);
                    console.log('✅ Login exitoso');
                    window.location.href = 'exam-system.html';
                } else {
                    showError(data.error || 'Credenciales incorrectas');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Por favor, inténtalo de nuevo.');
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('¡Cuenta creada! Iniciando sesión...');
                    setTimeout(() => {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('username', data.username);
                        window.location.href = 'exam-system.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Error en el registro');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Por favor, inténtalo de nuevo.');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }
    </script>
</body>
</html>
