<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Estudio por UT - Zarpeo</title>

    <!-- Favicon dinamico -->
    <link rel="icon" type="image/svg+xml" href="" id="dynamic-favicon">
    <script>
        const isProduction = window.location.hostname === 'zarpeo.com' || window.location.hostname === 'www.zarpeo.com';
        document.getElementById('dynamic-favicon').href = isProduction ? 'favicon-prod.svg' : 'favicon.svg';
        window.ENVIRONMENT = isProduction ? 'PRODUCCION' : 'DESARROLLO';
        window.ENVIRONMENT_COLOR = isProduction ? '#dc2626' : '#059669';
    </script>

    <!-- Tipografias Zarpeo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS Unificado Zarpeo -->
    <link rel="stylesheet" href="styles/unified-navigation.css">

    <style>
        /* =============================================================================
           VARIABLES ZARPEO
           ============================================================================= */
        :root {
            --color-marino: #0B3C5D;
            --color-oceano: #0E6BA8;
            --color-turquesa: #2EC4B6;
            --color-naranja: #F4A261;

            --bg-white: #FFFFFF;
            --bg-light: #F8FAFC;
            --bg-muted: #F1F5F9;
            --bg-subtle: #E2E8F0;

            --text-primary: #0B3C5D;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;

            --border-color: #E2E8F0;
            --border-radius: 12px;
            --border-radius-lg: 16px;

            --shadow-sm: 0 1px 2px rgba(11, 60, 93, 0.05);
            --shadow-md: 0 4px 12px rgba(11, 60, 93, 0.1);
            --shadow-lg: 0 8px 24px rgba(11, 60, 93, 0.15);

            --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-marino) 0%, var(--color-oceano) 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            margin: 20px auto;
            padding: 30px;
            max-width: 1400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--color-oceano);
            position: relative;
        }

        .header-actions {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-actions .btn {
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .header h1 {
            font-family: var(--font-heading);
            color: var(--text-primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header h1 i {
            color: var(--color-oceano);
            margin-right: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .filters-section {
            background: var(--bg-light);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .filters-section .form-label {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .filters-section .form-select,
        .filters-section .form-control {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-body);
        }

        .filters-section .form-select:focus,
        .filters-section .form-control:focus {
            border-color: var(--color-oceano);
            box-shadow: 0 0 0 3px rgba(14, 107, 168, 0.1);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--color-marino) 0%, var(--color-oceano) 100%);
            color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .stat-card .value {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .ut-section {
            margin-bottom: 30px;
        }

        .ut-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .ut-header {
            background: linear-gradient(135deg, var(--color-marino) 0%, var(--color-oceano) 100%);
            color: white;
            padding: 15px 20px;
            font-family: var(--font-heading);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ut-header .ut-number {
            font-size: 1.2rem;
        }

        .ut-body {
            padding: 20px;
        }

        .question-item {
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .question-item:last-child {
            border-bottom: none;
        }

        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, rgba(14, 107, 168, 0.05) 0%, rgba(46, 196, 182, 0.05) 100%);
            padding: 12px 16px;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--color-oceano);
            font-weight: 500;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .answer-box {
            padding: 12px 16px;
            border-radius: var(--border-radius);
            border-left: 4px solid;
            font-weight: 500;
        }

        .answer-box.correct {
            background: rgba(46, 196, 182, 0.1);
            border-color: var(--color-turquesa);
            color: #059669;
        }

        .answer-box.incorrect {
            background: #fdecea;
            border-color: #dc3545;
            color: #b71c1c;
        }

        .answer-note {
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .answer-note.warning {
            color: #b71c1c;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(14, 107, 168, 0.2);
            border-top: 4px solid var(--color-oceano);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #dc3545;
            color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            margin: 20px 0;
        }

        .btn-view-question {
            background: linear-gradient(135deg, var(--color-oceano), var(--color-turquesa));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-view-question:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-body);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-oceano);
            box-shadow: 0 0 0 3px rgba(14, 107, 168, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-oceano), var(--color-turquesa));
            border: none;
            font-family: var(--font-heading);
            font-weight: 500;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--color-marino), var(--color-oceano));
        }

        .btn-outline-light {
            border-color: var(--border-color);
            color: var(--text-secondary);
            font-family: var(--font-heading);
        }

        .btn-outline-light:hover {
            background: var(--color-oceano);
            border-color: var(--color-oceano);
            color: white;
        }

        .btn-success {
            background: var(--color-turquesa);
            border: none;
            font-family: var(--font-heading);
        }

        .btn-success:hover {
            background: #25a89c;
        }

        .btn-danger {
            background: var(--color-naranja);
            border: none;
            font-family: var(--font-heading);
        }

        .btn-danger:hover {
            background: #e8956e;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            .header-actions {
                position: static;
                justify-content: center;
                margin-bottom: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }

            .ut-header {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .question-meta {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-actions">
                <button class="btn btn-outline-light btn-sm" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Volver al dashboard
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="openStatistics()">
                    <i class="fas fa-chart-bar"></i> Ver estadisticas detalladas
                </button>
                <a href="#" id="exportCsvLink" class="btn btn-success btn-sm" download>
                    <i class="fas fa-file-csv"></i> Exportar CSV
                </a>
                <a href="#" id="exportPdfLink" class="btn btn-danger btn-sm" download>
                    <i class="fas fa-file-pdf"></i> Exportar PDF
                </a>
            </div>
            <h1><i class="fas fa-book"></i> Resumen de Estudio por UT</h1>
            <p>Listado depurado de preguntas activas, agrupadas por Unidad Tematica y mostrando solo la respuesta correcta.</p>
        </div>

        <!-- Filtros -->
        <div class="filters-section">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="utFilter" class="form-label">Filtrar por UT</label>
                    <select class="form-select" id="utFilter" onchange="filterByUT()">
                        <option value="all">Todas las UT</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="searchInput" class="form-label">Buscar por texto, examen o respuesta</label>
                    <input type="text" class="form-control search-input" id="searchInput"
                           placeholder="Ej: posidonia, ZEPIM, Junio 2024..."
                           onkeyup="filterBySearch()">
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <div class="d-grid">
                        <button class="btn btn-primary" onclick="loadSummary()">
                            <i class="fas fa-database"></i> Actualizado: --
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estadisticas -->
        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <div class="value">--</div>
                <div class="label">Unidades Tematicas incluidas</div>
            </div>
            <div class="stat-card">
                <div class="value">--</div>
                <div class="label">Preguntas activas</div>
            </div>
            <div class="stat-card">
                <div class="value" id="filterValue">Todos</div>
                <div class="label">Filtro aplicado</div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando resumen...</p>
        </div>

        <!-- Error -->
        <div id="error" style="display: none;"></div>

        <!-- Contenido -->
        <div id="content" style="display: none;">
            <div id="utsContainer"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.API_BASE || '/api';
        let summaryData = null;
        let filteredData = null;

        // Configurar enlaces de exportacion al cargar la pagina
        document.addEventListener('DOMContentLoaded', () => {
            const exportCsvLink = document.getElementById('exportCsvLink');
            const exportPdfLink = document.getElementById('exportPdfLink');
            if (exportCsvLink) {
                exportCsvLink.href = `${API_BASE}/study-summary/export`;
            }
            if (exportPdfLink) {
                exportPdfLink.href = `${API_BASE}/study-summary/export-pdf`;
            }
        });

        async function loadSummary() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');

            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/study-summary`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Error al cargar el resumen');
                }

                summaryData = data;
                filteredData = data;

                updateStats(data);
                populateUTFilter(data);
                renderUTs(data);

                loading.style.display = 'none';
                content.style.display = 'block';

                // Actualizar fecha de actualizacion
                const now = new Date();
                document.querySelector('.btn-primary').innerHTML =
                    `<i class="fas fa-database"></i> Actualizado: ${now.toLocaleTimeString()}`;

            } catch (err) {
                console.error('Error cargando resumen:', err);
                loading.style.display = 'none';
                const errorDiv = document.getElementById('error');
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Error al cargar el resumen</strong><br>
                            ${err.message}<br>
                            <small>No se pudo recuperar el resumen. Intenta nuevamente o revisa tu conexion.</small>
                        </div>
                    `;
                }
            }
        }

        function updateStats(data) {
            const utsIncluded = data.uts.filter(ut => ut.preguntas.length > 0).length;
            const totalQuestions = data.metadata.total_preguntas;

            const statsCards = document.querySelectorAll('.stat-card .value');
            if (statsCards.length >= 2) {
                statsCards[0].textContent = utsIncluded;
                statsCards[1].textContent = totalQuestions.toLocaleString();
            }
        }

        function populateUTFilter(data) {
            const select = document.getElementById('utFilter');
            // Limpiar opciones existentes excepto "Todas las UT"
            while (select.children.length > 1) {
                select.removeChild(select.lastChild);
            }

            data.uts.forEach(ut => {
                if (ut.preguntas.length > 0) {
                    const option = document.createElement('option');
                    option.value = ut.ut_number || 'null';
                    option.textContent = `UT ${ut.ut_number}: ${ut.ut_name}`;
                    select.appendChild(option);
                }
            });
        }

        function renderUTs(data) {
            const container = document.getElementById('utsContainer');

            if (!data.uts || data.uts.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No hay preguntas disponibles</p>';
                return;
            }

            container.innerHTML = data.uts
                .filter(ut => ut.preguntas.length > 0)
                .map(ut => `
                    <div class="ut-section" data-ut-number="${ut.ut_number || 'null'}">
                        <div class="ut-card">
                            <div class="ut-header">
                                <div>
                                    <span class="ut-number">UT ${ut.ut_number || 'N/A'}</span>
                                    <span class="ms-2">${ut.ut_name}</span>
                                </div>
                                <span>${ut.preguntas.length} preguntas</span>
                            </div>
                            <div class="ut-body">
                                ${ut.preguntas.map(q => {
                                    const esIncorrecta = (q.texto_pregunta || '').toLowerCase().includes('incorrecta');
                                    const answerClass = esIncorrecta ? 'answer-box incorrect' : 'answer-box correct';
                                    const warningNote = esIncorrecta
                                        ? '<div class="answer-note warning"><i class="fas fa-exclamation-triangle"></i>Esta afirmacion es incorrecta (la pregunta pedia la opcion erronea).</div>'
                                        : '';
                                    return `
                                        <div class="question-item" data-question-id="${q.question_id}">
                                            <div class="question-text">${q.texto_pregunta}</div>
                                            <div class="question-meta">
                                                <div style="flex: 1; min-width: 0;">
                                                    <div class="${answerClass}">
                                                        ${q.respuesta_correcta.texto || 'No disponible'}
                                                    </div>
                                                    ${warningNote}
                                                    <div style="margin-top: 8px; font-size: 0.8rem; color: #6c757d;">
                                                        <i class="fas fa-calendar"></i> ${q.examen.titulo || 'N/A'}
                                                    </div>
                                                </div>
                                                <div style="display: flex; align-items: flex-start;">
                                                    <button class="btn-view-question" onclick="viewQuestion('${q.question_id}')">
                                                        <i class="fas fa-eye"></i> Ver en banco
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        function filterByUT() {
            const selectedUT = document.getElementById('utFilter').value;

            if (!summaryData) return;

            if (selectedUT === 'all') {
                filteredData = summaryData;
                document.getElementById('filterValue').textContent = 'Todos';
            } else {
                const utNumber = selectedUT === 'null' ? null : parseInt(selectedUT);
                filteredData = {
                    ...summaryData,
                    uts: summaryData.uts.filter(ut => {
                        const utNum = ut.ut_number;
                        return (utNum === null && selectedUT === 'null') ||
                               (utNum !== null && utNum === utNumber);
                    })
                };
                const selectedOption = document.getElementById('utFilter').selectedOptions[0];
                document.getElementById('filterValue').textContent = selectedOption.textContent;
            }

            renderUTs(filteredData);
            updateStats(filteredData);
        }

        function filterBySearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!summaryData) return;

            if (!searchTerm) {
                filteredData = summaryData;
                filterByUT(); // Aplicar tambien el filtro de UT
                return;
            }

            const filteredUTs = summaryData.uts.map(ut => ({
                ...ut,
                preguntas: ut.preguntas.filter(q => {
                    const textoMatch = q.texto_pregunta.toLowerCase().includes(searchTerm);
                    const respuestaMatch = q.respuesta_correcta.letra.toLowerCase().includes(searchTerm) ||
                                         q.respuesta_correcta.texto.toLowerCase().includes(searchTerm);
                    const examenMatch = (q.examen.titulo || '').toLowerCase().includes(searchTerm) ||
                                       (q.examen.convocatoria || '').toLowerCase().includes(searchTerm);
                    return textoMatch || respuestaMatch || examenMatch;
                })
            })).filter(ut => ut.preguntas.length > 0);

            filteredData = {
                ...summaryData,
                uts: filteredUTs
            };

            // Aplicar tambien el filtro de UT si esta activo
            const selectedUT = document.getElementById('utFilter').value;
            if (selectedUT !== 'all') {
                filterByUT();
                return;
            }

            renderUTs(filteredData);
            updateStats(filteredData);
        }

        function viewQuestion(questionId) {
            window.open(`visor-nueva-arquitectura.html?question_id=${questionId}`, '_blank');
        }

        function goBack() {
            window.location.href = 'exam-system.html';
        }

        function openStatistics() {
            window.open('statistics-dashboard.html?tab=topics', '_blank');
        }

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadSummary();
        });
    </script>
</body>
</html>
