<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Estudio por UT - Zarpeo</title>

    <!-- Favicon dinámico -->
    <link rel="icon" type="image/svg+xml" href="" id="dynamic-favicon">
    <script>
        const isProduction = window.location.hostname === 'zarpeo.com' || window.location.hostname === 'www.zarpeo.com';
        document.getElementById('dynamic-favicon').href = isProduction ? 'favicon-prod.svg' : 'favicon.svg';
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            padding: 30px;
            max-width: 1400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
            position: relative;
        }

        .header-actions {
            position: absolute;
            top: 0;
            right: 0;
        }

        .header-actions .btn {
            margin-left: 10px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .filters-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .ut-section {
            margin-bottom: 30px;
        }

        .ut-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .ut-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ut-header .ut-number {
            font-size: 1.3rem;
        }

        .ut-body {
            padding: 20px;
        }

        .question-item {
            border-bottom: 1px solid #e9ecef;
            padding: 15px 0;
        }

        .question-item:last-child {
            border-bottom: none;
        }

        .question-text {
            font-size: 1rem;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #2c3e50;
            background: linear-gradient(135deg, #f0f4ff 0%, #e6edff 100%);
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            font-weight: 500;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .answer-box {
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 4px solid;
            font-weight: 500;
        }

        .answer-box.correct {
            background: #e8f5e9;
            border-color: #28a745;
            color: #2e7d32;
        }

        .answer-box.incorrect {
            background: #fdecea;
            border-color: #dc3545;
            color: #b71c1c;
        }

        .answer-note {
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .answer-note.warning {
            color: #b71c1c;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #dc3545;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .btn-view-question {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-view-question:hover {
            background: #5a6fd8;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-actions">
                <button class="btn btn-outline-light btn-sm" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Volver al dashboard
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="openStatistics()">
                    <i class="fas fa-chart-bar"></i> Ver estadísticas detalladas
                </button>
                <a href="#" id="exportCsvLink" class="btn btn-success btn-sm" download style="margin-left: 10px;">
                    <i class="fas fa-file-csv"></i> Exportar CSV
                </a>
                <a href="#" id="exportPdfLink" class="btn btn-danger btn-sm" download style="margin-left: 5px;">
                    <i class="fas fa-file-pdf"></i> Exportar PDF
                </a>
            </div>
            <h1><i class="fas fa-book"></i> Resumen de Estudio por UT</h1>
            <p>Listado depurado de preguntas activas, agrupadas por Unidad Temática y mostrando solo la respuesta correcta.</p>
        </div>

        <!-- Filtros -->
        <div class="filters-section">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="utFilter" class="form-label">Filtrar por UT</label>
                    <select class="form-select" id="utFilter" onchange="filterByUT()">
                        <option value="all">Todas las UT</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="searchInput" class="form-label">Buscar por texto, examen o respuesta</label>
                    <input type="text" class="form-control search-input" id="searchInput" 
                           placeholder="Ej: posidonia, ZEPIM, Junio 2024..." 
                           onkeyup="filterBySearch()">
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <div class="d-grid">
                        <button class="btn btn-primary" onclick="loadSummary()">
                            <i class="fas fa-database"></i> Actualizado: --
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <div class="value">--</div>
                <div class="label">Unidades Temáticas incluidas</div>
            </div>
            <div class="stat-card">
                <div class="value">--</div>
                <div class="label">Preguntas activas</div>
            </div>
            <div class="stat-card">
                <div class="value" id="filterValue">Todos</div>
                <div class="label">Filtro aplicado</div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando resumen...</p>
        </div>

        <!-- Error -->
        <div id="error" style="display: none;"></div>

        <!-- Contenido -->
        <div id="content" style="display: none;">
            <div id="utsContainer"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.API_BASE || '/api';
        let summaryData = null;
        let filteredData = null;

        // Configurar enlaces de exportación al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const exportCsvLink = document.getElementById('exportCsvLink');
            const exportPdfLink = document.getElementById('exportPdfLink');
            if (exportCsvLink) {
                exportCsvLink.href = `${API_BASE}/study-summary/export`;
            }
            if (exportPdfLink) {
                exportPdfLink.href = `${API_BASE}/study-summary/export-pdf`;
            }
        });

        async function loadSummary() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');

            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/study-summary`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Error al cargar el resumen');
                }

                summaryData = data;
                filteredData = data;
                
                updateStats(data);
                populateUTFilter(data);
                renderUTs(data);
                
                loading.style.display = 'none';
                content.style.display = 'block';

                // Actualizar fecha de actualización
                const now = new Date();
                document.querySelector('.btn-primary').innerHTML = 
                    `<i class="fas fa-database"></i> Actualizado: ${now.toLocaleTimeString()}`;

            } catch (err) {
                console.error('Error cargando resumen:', err);
                loading.style.display = 'none';
                const errorDiv = document.getElementById('error');
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Error al cargar el resumen</strong><br>
                            ${err.message}<br>
                            <small>No se pudo recuperar el resumen. Intenta nuevamente o revisa tu conexión.</small>
                        </div>
                    `;
                }
            }
        }

        function updateStats(data) {
            const utsIncluded = data.uts.filter(ut => ut.preguntas.length > 0).length;
            const totalQuestions = data.metadata.total_preguntas;

            const statsCards = document.querySelectorAll('.stat-card .value');
            if (statsCards.length >= 2) {
                statsCards[0].textContent = utsIncluded;
                statsCards[1].textContent = totalQuestions.toLocaleString();
            }
        }

        function populateUTFilter(data) {
            const select = document.getElementById('utFilter');
            // Limpiar opciones existentes excepto "Todas las UT"
            while (select.children.length > 1) {
                select.removeChild(select.lastChild);
            }

            data.uts.forEach(ut => {
                if (ut.preguntas.length > 0) {
                    const option = document.createElement('option');
                    option.value = ut.ut_number || 'null';
                    option.textContent = `UT ${ut.ut_number}: ${ut.ut_name}`;
                    select.appendChild(option);
                }
            });
        }

        function renderUTs(data) {
            const container = document.getElementById('utsContainer');
            
            if (!data.uts || data.uts.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No hay preguntas disponibles</p>';
                return;
            }

            container.innerHTML = data.uts
                .filter(ut => ut.preguntas.length > 0)
                .map(ut => `
                    <div class="ut-section" data-ut-number="${ut.ut_number || 'null'}">
                        <div class="ut-card">
                            <div class="ut-header">
                                <div>
                                    <span class="ut-number">UT ${ut.ut_number || 'N/A'}</span>
                                    <span class="ms-2">${ut.ut_name}</span>
                                </div>
                                <span>${ut.preguntas.length} preguntas</span>
                            </div>
                            <div class="ut-body">
                                ${ut.preguntas.map(q => {
                                    const esIncorrecta = (q.texto_pregunta || '').toLowerCase().includes('incorrecta');
                                    const answerClass = esIncorrecta ? 'answer-box incorrect' : 'answer-box correct';
                                    const warningNote = esIncorrecta
                                        ? '<div class="answer-note warning"><i class="fas fa-exclamation-triangle"></i>Esta afirmación es incorrecta (la pregunta pedía la opción errónea).</div>'
                                        : '';
                                    return `
                                        <div class="question-item" data-question-id="${q.question_id}">
                                            <div class="question-text">${q.texto_pregunta}</div>
                                            <div class="question-meta">
                                                <div style="flex: 1; min-width: 0;">
                                                    <div class="${answerClass}">
                                                        ${q.respuesta_correcta.texto || 'No disponible'}
                                                    </div>
                                                    ${warningNote}
                                                    <div style="margin-top: 8px; font-size: 0.8rem; color: #6c757d;">
                                                        <i class="fas fa-calendar"></i> ${q.examen.titulo || 'N/A'}
                                                    </div>
                                                </div>
                                                <div style="display: flex; align-items: flex-start;">
                                                    <button class="btn-view-question" onclick="viewQuestion('${q.question_id}')">
                                                        <i class="fas fa-eye"></i> Ver en banco
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        function filterByUT() {
            const selectedUT = document.getElementById('utFilter').value;
            
            if (!summaryData) return;

            if (selectedUT === 'all') {
                filteredData = summaryData;
                document.getElementById('filterValue').textContent = 'Todos';
            } else {
                const utNumber = selectedUT === 'null' ? null : parseInt(selectedUT);
                filteredData = {
                    ...summaryData,
                    uts: summaryData.uts.filter(ut => {
                        const utNum = ut.ut_number;
                        return (utNum === null && selectedUT === 'null') || 
                               (utNum !== null && utNum === utNumber);
                    })
                };
                const selectedOption = document.getElementById('utFilter').selectedOptions[0];
                document.getElementById('filterValue').textContent = selectedOption.textContent;
            }

            renderUTs(filteredData);
            updateStats(filteredData);
        }

        function filterBySearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!summaryData) return;

            if (!searchTerm) {
                filteredData = summaryData;
                filterByUT(); // Aplicar también el filtro de UT
                return;
            }

            const filteredUTs = summaryData.uts.map(ut => ({
                ...ut,
                preguntas: ut.preguntas.filter(q => {
                    const textoMatch = q.texto_pregunta.toLowerCase().includes(searchTerm);
                    const respuestaMatch = q.respuesta_correcta.letra.toLowerCase().includes(searchTerm) ||
                                         q.respuesta_correcta.texto.toLowerCase().includes(searchTerm);
                    const examenMatch = (q.examen.titulo || '').toLowerCase().includes(searchTerm) ||
                                       (q.examen.convocatoria || '').toLowerCase().includes(searchTerm);
                    return textoMatch || respuestaMatch || examenMatch;
                })
            })).filter(ut => ut.preguntas.length > 0);

            filteredData = {
                ...summaryData,
                uts: filteredUTs
            };

            // Aplicar también el filtro de UT si está activo
            const selectedUT = document.getElementById('utFilter').value;
            if (selectedUT !== 'all') {
                filterByUT();
                return;
            }

            renderUTs(filteredData);
            updateStats(filteredData);
        }

        function viewQuestion(questionId) {
            window.open(`visor-nueva-arquitectura.html?question_id=${questionId}`, '_blank');
        }

        function goBack() {
            window.location.href = 'exam-system.html';
        }

        function openStatistics() {
            window.open('statistics-dashboard.html?tab=topics', '_blank');
        }

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadSummary();
        });
    </script>
</body>
</html>
